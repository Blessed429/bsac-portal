<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password | BSAC Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container" style="padding:28px 20px">
    <div class="login-card" style="max-width:420px">
        <div class="login-header">
            <div class="logo-box" style="background:var(--blk8);color:#fff"><i class="ti ti-key" aria-hidden="true"></i></div>
            <h1>Create Password</h1>
            <p>Set a secure password for <strong th:text="${email}">email@domain.com</strong></p>
        </div>

        <div th:if="${error}" class="error-message">
            <i class="ti ti-alert-circle" style="margin-right:4px"></i>
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/admin/create-password}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" class="form-control" required
                       placeholder="Enter new password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:16px;background:var(--blk8)">
                <i class="ti ti-circle-check" style="margin-right:6px"></i>Complete Registration
            </button>
        </form>
    </div>
</div>
</body>
</html>
