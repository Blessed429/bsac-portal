<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | BSAC Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container" style="padding:28px 20px">
    <div class="login-card" style="max-width:420px">
        <div class="login-header">
            <div class="logo-box" style="background:var(--blk8);color:#fff"><i class="ti ti-shield-lock" aria-hidden="true"></i></div>
            <h1>BSAC Admin Portal</h1>
            <p>Bulawayo Student Accommodation Centre</p>
        </div>

        <div th:if="${param.error}" class="error-message">
            <i class="ti ti-alert-circle" style="margin-right:4px"></i>Invalid admin email or password.
        </div>
        <div th:if="${param.logout}" class="success-message">
            <i class="ti ti-check" style="margin-right:4px"></i>Logged out successfully.
        </div>
        <div th:if="${param.registered}" class="success-message">
            <i class="ti ti-check" style="margin-right:4px"></i>Admin profile created! Please sign in.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Admin Email Address</label>
                <input type="email" id="username" name="username" class="form-control" required
                       placeholder="e.g. admin@bsac.ac.zw" autocomplete="username">
            </div>
            <div class="form-group" style="position:relative">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required
                       placeholder="Enter admin password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:16px;background:var(--blk8)">
                <i class="ti ti-login" style="margin-right:6px"></i>Sign in
            </button>
        </form>

        <div style="text-align:center;margin-top:18px;font-size:12px;color:var(--gray)">
            Need to register an admin account?
            <a href="/admin/register" style="color:var(--blk8);font-weight:600;text-decoration:none;margin-left:4px">Register Admin</a>
            <span style="margin:0 6px;color:var(--border)">|</span>
            <a href="/login" style="color:var(--g700);font-weight:600;text-decoration:none">Student Login</a>
        </div>
    </div>
</div>
</body>
</html>
