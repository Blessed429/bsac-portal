<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | BSAC Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-container" style="padding:28px 20px">
    <div class="login-card" style="max-width:420px">
        <div class="login-header">
            <div class="logo-box" style="background:var(--blk8);color:#fff"><i class="ti ti-mail-opened" aria-hidden="true"></i></div>
            <h1>Email Verification</h1>
            <p>Enter the 6-digit verification code sent to <br><strong th:text="${email}">email@domain.com</strong></p>
        </div>

        <!-- Simulated development alert popup for smooth testing -->
        <div th:if="${simulatedCode}" class="success-message" style="background:var(--g50);color:var(--g800);border-color:var(--g300);padding:14px;margin-bottom:20px;text-align:left">
            <div style="font-weight:700;font-size:12px;margin-bottom:4px"><i class="ti ti-mail" style="margin-right:4px"></i>Simulated Email Dispatch:</div>
            <div style="font-size:11px;line-height:1.4">
                We've intercepted the system dispatch to your email! Your 6-digit admin verification code is:
                <div style="font-size:20px;font-weight:700;letter-spacing:3px;margin:8px 0;color:var(--g800);background:#fff;padding:8px;border-radius:6px;border:1px solid var(--border);text-align:center" th:text="${simulatedCode}">123456</div>
            </div>
        </div>

        <div th:if="${error}" class="error-message">
            <i class="ti ti-alert-circle" style="margin-right:4px"></i>
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/admin/verify}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <div class="form-group">
                <label for="code">6-Digit Verification Code</label>
                <input type="text" id="code" name="code" class="form-control" required
                       placeholder="e.g. 123456" maxlength="6" pattern="[0-9]{6}" style="text-align:center;font-size:22px;letter-spacing:4px;font-weight:700">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:16px;background:var(--blk8)">
                <i class="ti ti-shield-check" style="margin-right:6px"></i>Verify Code
            </button>
        </form>
    </div>
</div>
</body>
</html>
